<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoTube Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c10; --bg2:#111319; --raise:#171a22; --glass:rgba(23,26,34,.72); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --text:#f3f2ee; --dim:#a1a3ab; --mute:#6c6f79;
  --tally:#ff3b30; --tally-soft:rgba(255,59,48,.16); --ok:#4fd18b; --ok-soft:rgba(79,209,139,.14); --work:#7aa7ff; --work-soft:rgba(122,167,255,.14); --warn:#ffa940; --warn-soft:rgba(255,169,64,.15);
  --cta:#f3f2ee; --cta-text:#0b0c10; --shadow:0 30px 80px rgba(0,0,0,.55);
  --display:"Bricolage Grotesque",system-ui,sans-serif; --ui:"Geist",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f1f0ec; --bg2:#e8e7e2; --raise:#ffffff; --glass:rgba(255,255,255,.78); --line:rgba(10,12,16,.09); --line2:rgba(10,12,16,.18);
  --text:#121318; --dim:#555862; --mute:#8b8e97; --tally:#e5281d; --tally-soft:rgba(229,40,29,.1); --ok:#1f9a5a; --ok-soft:rgba(31,154,90,.12); --work:#2a62d6; --work-soft:rgba(42,98,214,.1); --warn:#b86200; --warn-soft:rgba(184,98,0,.12);
  --cta:#121318; --cta-text:#fff; --shadow:0 24px 60px rgba(20,22,30,.16); color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15.5px/1.55 var(--ui);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
a{color:var(--work)}
::selection{background:var(--tally);color:#fff}
:focus-visible{outline:2px solid var(--work);outline-offset:3px;border-radius:6px}
button{font:inherit;color:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
code{font:13px var(--mono);background:var(--bg2);padding:2px 6px;border-radius:5px;border:1px solid var(--line)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s}

/* ---------- top bar ---------- */
.top{position:fixed;inset:0 0 auto 0;height:64px;display:flex;align-items:center;gap:18px;padding:0 28px;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);border-bottom:1px solid var(--line);pointer-events:none}
.top>*{pointer-events:auto}
.logo{white-space:nowrap;display:flex;align-items:center;gap:10px;font:700 18px var(--display);letter-spacing:-.01em;background:none;border:0;cursor:pointer;padding:0}
.tallydot{width:11px;height:11px;border-radius:50%;background:var(--tally);box-shadow:0 0 0 4px var(--tally-soft)}
.tallydot.live{animation:tally 1.6s ease-in-out infinite}
@keyframes tally{50%{box-shadow:0 0 0 9px transparent}}
.clock{font:500 13.5px var(--mono);color:var(--dim)}
.top .sp{flex:1}
.status{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--dim);background:var(--glass);border:1px solid var(--line);padding:6px 12px;border-radius:99px;backdrop-filter:blur(14px)}
.spin{width:12px;height:12px;border:2px solid var(--work-soft);border-top-color:var(--work);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.kbtn{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--dim);background:var(--glass);border:1px solid var(--line);padding:6px 8px 6px 12px;border-radius:99px;cursor:pointer;backdrop-filter:blur(14px)}
.kbtn kbd{font:600 11.5px var(--mono);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--text)}
.ibtn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--glass);cursor:pointer;backdrop-filter:blur(14px)}
.ibtn svg{width:17px;height:17px}

/* ---------- dock ---------- */
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;display:flex;gap:4px;padding:6px;border-radius:20px;background:var(--glass);border:1px solid var(--line2);backdrop-filter:blur(22px) saturate(1.4);box-shadow:var(--shadow)}
.dock button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:74px;padding:8px 10px 6px;border:0;border-radius:14px;background:none;cursor:pointer;color:var(--dim);font-size:12px;font-weight:500;transition:background .15s,color .15s,transform .15s}
.dock button svg{width:21px;height:21px}
.dock button:hover{color:var(--text);transform:translateY(-2px)}
.dock button.on{background:var(--text);color:var(--bg)}
.dock .badge{position:absolute;top:3px;right:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--tally);color:#fff;font:700 11px/18px var(--ui);text-align:center}
@media(max-width:720px){.dock{left:8px;right:8px;transform:none;overflow-x:auto;justify-content:flex-start}.dock button{min-width:50px;padding:7px 6px 5px;font-size:10.5px}.dock .badge{right:4px}.top{padding:0 14px;gap:10px}.clock,.kbtn,.status{display:none}.logo{white-space:nowrap}}

main{padding:84px 28px 130px;max-width:1500px;margin:0 auto}
@media(max-width:720px){main{padding:76px 14px 120px}}
.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}

/* ---------- type ---------- */
.h1{font:800 clamp(44px,7vw,108px)/.9 var(--display);letter-spacing:-.035em;margin:0}
.h2{font:700 clamp(24px,2.6vw,34px)/1 var(--display);letter-spacing:-.02em;margin:0}
.h3{font:650 19px/1.2 var(--display);margin:0}
.sub{color:var(--dim);font-size:17px;max-width:60ch;margin:14px 0 0}
.note{color:var(--dim);font-size:14px;max-width:72ch}
.err{color:var(--tally);font-size:14px}.warnt{color:var(--warn);font-size:14px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:18px 0 34px}
.sec{display:flex;align-items:baseline;gap:14px;margin:56px 0 18px;flex-wrap:wrap}
.sec .count{font:500 13px var(--mono);color:var(--mute)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14.5px var(--ui);padding:11px 18px;border-radius:12px;border:1px solid var(--line2);background:var(--raise);color:var(--text);cursor:pointer;text-decoration:none;transition:transform .12s,background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--text)}
.btn:active{transform:scale(.97)}
.btn.cta{background:var(--cta);color:var(--cta-text);border-color:var(--cta)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06140c}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--tally);border-color:var(--tally-soft)}
.btn.big{padding:15px 24px;font-size:16px;border-radius:14px}
.btn:disabled{opacity:.5;cursor:wait}
.btn svg{width:17px;height:17px}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:grid;gap:7px;font-weight:600;font-size:14px}
label.f small{font-weight:400;color:var(--dim);font-size:13px}
input,select,textarea{font:15px var(--ui);color:var(--text);background:var(--bg2);border:1px solid var(--line2);border-radius:11px;padding:11px 13px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--work);box-shadow:0 0 0 4px var(--work-soft)}
textarea{resize:vertical;line-height:1.55}
.check{display:flex;gap:12px;align-items:center;cursor:pointer;font-size:14.5px}
.sw{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line2);position:relative;cursor:pointer;flex:none;padding:0;border:0;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.sw:checked{background:var(--ok)}.sw:checked::after{transform:translateX(18px)}
.sw:focus{box-shadow:0 0 0 4px var(--work-soft)}
.panel{background:var(--raise);border:1px solid var(--line);border-radius:22px;padding:26px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.stack{display:grid;gap:16px;align-content:start}
.chip{display:inline-flex;align-items:center;gap:7px;font:600 12.5px var(--ui);padding:5px 10px;border-radius:99px;background:var(--bg2);color:var(--dim);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.chip.need{background:var(--tally-soft);color:var(--tally)}.chip.need i{animation:tally2 1.4s infinite}
@keyframes tally2{50%{opacity:.25}}
.chip.work{background:var(--work-soft);color:var(--work)}.chip.done{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--warn-soft);color:var(--warn)}
.seg{display:inline-flex;padding:4px;border-radius:13px;background:var(--bg2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--dim)}
.seg button.on{background:var(--raise);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2)}
details summary{cursor:pointer;font-weight:600;color:var(--dim);list-style:none;display:flex;align-items:center;gap:10px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
details[open] summary::before{transform:rotate(45deg)}
pre.log{font:12.5px/1.65 var(--mono);white-space:pre-wrap;max-height:340px;overflow:auto;background:var(--bg2);border:1px solid var(--line);padding:16px 18px;border-radius:14px;color:var(--dim);margin:12px 0 0}

/* ---------- hero (on deck) ---------- */
.hero{position:relative;min-height:min(68vh,640px);border-radius:30px;overflow:hidden;display:flex;align-items:flex-end;isolation:isolate;background:#000;box-shadow:var(--shadow)}
.hero .bg{position:absolute;inset:0;z-index:-2;overflow:hidden}
.hero .bg img,.hero .bg video{width:100%;height:100%;object-fit:cover;animation:kb 26s ease-in-out infinite alternate}
.hero .bg.blur img{filter:blur(40px) saturate(1.3) brightness(.7);transform:scale(1.2);animation:none}
@keyframes kb{to{transform:scale(1.09) translate(-1.5%,-1%)}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.15) 40%,rgba(0,0,0,.88) 100%),radial-gradient(600px circle at var(--mx,70%) var(--my,30%),rgba(255,255,255,.08),transparent 60%)}
.hero .vert{position:absolute;right:6%;top:50%;transform:translateY(-50%);height:84%;aspect-ratio:9/16;border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);z-index:-1}
.hero .vert video,.hero .vert img{width:100%;height:100%;object-fit:cover}
.hero .in{padding:clamp(24px,4vw,54px);color:#fff;max-width:min(900px,100%)}
.hero .kick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.hero .kick .chip{background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(10px)}
.hero .kick .chip.need{background:var(--tally);color:#fff}
.hero h1{font:800 clamp(38px,6.2vw,96px)/.92 var(--display);letter-spacing:-.035em;margin:0;text-wrap:balance;text-shadow:0 4px 40px rgba(0,0,0,.4)}
.hero .meta{font:500 14px var(--mono);color:rgba(255,255,255,.72);margin:18px 0 26px}
.hero .btn{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;backdrop-filter:blur(12px)}
.hero .btn.cta{background:#fff;color:#000;border-color:#fff}
.hero .pager{position:absolute;top:22px;right:22px;display:flex;gap:8px;align-items:center;color:#fff;font:600 13px var(--mono)}
.hero .pager button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;cursor:pointer;backdrop-filter:blur(10px);display:grid;place-items:center}
.hero .pager svg{width:16px;height:16px}
.hero.clear{min-height:320px;background:radial-gradient(900px 400px at 80% 0%,var(--ok-soft),transparent),var(--raise);box-shadow:none;border:1px solid var(--line)}
.hero.clear::before{display:none}.hero.clear .in{color:var(--text)}
@media(max-width:800px){.hero .vert{display:none}}

/* ---------- run sheet timeline ---------- */
.runsheet{background:var(--raise);border:1px solid var(--line);border-radius:22px;padding:22px 24px 18px;overflow-x:auto}
.rs-in{min-width:760px;position:relative}
.rs-hours{display:grid;grid-template-columns:150px 1fr;font:500 11.5px var(--mono);color:var(--mute);margin-bottom:8px}
.rs-hours div:last-child{display:flex;justify-content:space-between}
.rs-row{display:grid;grid-template-columns:150px 1fr;align-items:center;height:50px;border-top:1px solid var(--line)}
.rs-row b{font:600 14px var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:12px}
.rs-track{position:relative;height:100%}
.rs-make{position:absolute;top:13px;height:24px;border-radius:8px;background:repeating-linear-gradient(-45deg,var(--work-soft) 0 8px,transparent 8px 14px),var(--work-soft);border:1px solid var(--work);display:flex;align-items:center;padding:0 9px;font:600 11.5px var(--ui);color:var(--work);white-space:nowrap;overflow:hidden}
.rs-ready{position:absolute;top:8px;bottom:8px;width:2px;background:var(--ok)}
.rs-ready span{position:absolute;top:-1px;left:6px;font:600 11px var(--mono);color:var(--ok);white-space:nowrap}
.rs-pub{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--text);border:2px solid var(--raise)}
.rs-pub.short{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:var(--dim)}
.rs-now{position:absolute;top:24px;bottom:0;width:2px;background:var(--tally);z-index:2;pointer-events:none;transition:left 1s}
.rs-now::before{content:attr(data-t);position:absolute;top:-22px;left:50%;transform:translateX(-50%);font:700 11px var(--mono);color:#fff;background:var(--tally);padding:1px 6px;border-radius:5px}
.rs-off b{color:var(--mute)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block}

/* ---------- reels ---------- */
.reel{display:flex;gap:16px;overflow-x:auto;padding:6px 2px 18px;scroll-snap-type:x proximity;scrollbar-width:thin}
.card{flex:none;scroll-snap-align:start;position:relative;height:250px;border-radius:20px;overflow:hidden;cursor:pointer;background:var(--bg2);border:1px solid var(--line);padding:0;text-align:left;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;isolation:isolate;color:#fff}
.card.long{width:444px}.card.short{width:170px}
.card:hover{transform:translateY(-4px) scale(1.015);box-shadow:var(--shadow)}
.card img,.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.card video{opacity:0;transition:opacity .3s}.card.playing video{opacity:1}
.card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.85))}
.card .ph{position:absolute;inset:0;z-index:-2;display:grid;place-items:center;font:800 28px var(--display);color:var(--mute);background:repeating-linear-gradient(45deg,var(--bg2) 0 16px,var(--raise) 16px 32px)}
.card .top-l{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.card .top-l .chip{background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(8px)}
.card .top-l .chip.need{background:var(--tally)}
.card .top-l .chip.work{background:rgba(30,60,140,.75)}.card .top-l .chip.done{background:rgba(20,110,60,.8)}.card .top-l .chip.bad{background:rgba(150,80,0,.85)}
.card.short .top-l .chip{font-size:11px;padding:4px 8px}
.card .bot{position:absolute;left:14px;right:14px;bottom:13px}
.card .bot b{font:650 17px/1.2 var(--display);letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.short .bot b{font-size:14.5px}
.card .bot span{display:block;font:500 12px var(--mono);color:rgba(255,255,255,.7);margin-top:6px}
.card.need{box-shadow:0 0 0 2px var(--tally)}
.card.empty{width:100%;height:120px;display:grid;place-items:center;color:var(--mute);cursor:default;background:transparent;border-style:dashed}
.card.empty::after{display:none}
.card.empty:hover{transform:none;box-shadow:none}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.wall .card{width:auto}

/* ---------- list (all videos) ---------- */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar input{max-width:320px}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:120px minmax(0,1fr) 120px 170px 96px 190px;gap:18px;align-items:center;padding:10px 16px 10px 10px;border-radius:16px;background:var(--raise);border:1px solid var(--line);cursor:pointer;transition:border-color .15s,transform .15s;text-align:left;width:100%}
.row:hover{border-color:var(--line2);transform:translateX(3px)}
.row .th{width:120px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--bg2)}
.row .th img{width:100%;height:100%;object-fit:cover;display:block}
.row b{font:600 15.5px var(--ui);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--dim);font-size:13px}
.row .mono{font:500 13px var(--mono);color:var(--dim)}
.row select.act{font:500 13.5px var(--ui);padding:8px 10px;border-radius:10px;width:100%}
@media(max-width:900px){.row{grid-template-columns:96px 1fr}.row>:nth-child(n+3){display:none}.row>select.act{display:block;grid-column:1/-1}.row .th{width:96px}}

/* ---------- job / theater ---------- */
.backdrop{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.backdrop img{width:100%;height:100%;object-fit:cover;filter:blur(70px) saturate(1.4);opacity:.32;transform:scale(1.2)}
:root[data-theme="light"] .backdrop img{opacity:.2}
.backbtn{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);padding:8px 14px 8px 10px;border-radius:99px;cursor:pointer;font-weight:600;font-size:14px;backdrop-filter:blur(12px)}
.backbtn svg{width:16px;height:16px}
.theater{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:22px;align-items:start;margin-top:8px}
@media(max-width:1050px){.theater{grid-template-columns:1fr}}
.screen{border-radius:24px;overflow:hidden;background:#000;box-shadow:var(--shadow);display:grid;place-items:center}
.screen video{width:100%;max-height:76vh;display:block;background:#000}
.screen.v video{width:auto;max-width:100%;height:76vh}
.facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;font:500 13px var(--mono);color:var(--dim)}
.facts b{color:var(--text);font-weight:600}
.glass{background:var(--glass);border:1px solid var(--line2);border-radius:24px;padding:24px;backdrop-filter:blur(24px) saturate(1.3)}
.thumbimg{width:100%;max-height:360px;object-fit:contain;border-radius:14px;display:block;background:#000;margin:14px 0 12px}

/* plan editor */
.chap{margin-top:30px;border-radius:24px;background:var(--raise);border:1px solid var(--line);overflow:hidden}
.chap-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:18px 22px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--bg2),transparent)}
.chap-h .no{font:600 12px var(--mono);color:var(--tally);letter-spacing:.04em}
.chap-h .h3{margin-right:auto}
.chap-h select,.chap-h input{width:auto;padding:7px 10px;font-size:13.5px;border-radius:9px}
.chap-h input{min-width:240px}
.ln{display:grid;grid-template-columns:40px minmax(0,1.2fr) minmax(240px,1fr) 32px;gap:16px;padding:14px 22px;border-top:1px solid var(--line);align-items:start}
.chap-h+.ln{border-top:0}
.ln .k{font:500 12px var(--mono);color:var(--mute);padding-top:7px}
.ln textarea{border:1px solid transparent;background:transparent;font:16px/1.6 var(--ui);padding:5px 10px;margin:-5px -10px;resize:none;field-sizing:content;min-height:40px;width:calc(100% + 20px)}
.ln textarea:hover{border-color:var(--line)}
.ln textarea:focus{background:var(--bg2)}
.shots{display:flex;flex-wrap:wrap;gap:6px}

function collectPlan() {
  const sc = openJob.script; sc.title = $('#sTitle').value; sc.description = $('#sDesc').value; sc.tags = $('#sTags').value.split(',').map(x => x.trim()).filter(Boolean); sc.thumbText = $('#sThumb').value.trim(); sc.next = $('#sNext').value;
  $$('[data-cf]').forEach(e => { const ch = sc.chapters[+e.dataset.ci], f = e.dataset.cf; ch[f] = f === 'title' ? (e.value.trim() ? e.value.split('|').map(x => x.trim()) : null) : e.value; });
  $$('textarea[data-li]').forEach(e => { sc.chapters[+e.dataset.ci].lines[+e.dataset.li].say = e.value; });
  $$('[data-if]').forEach(e => { const im = sc.images[+e.dataset.ii]; if (e.dataset.if === 'queries') im.queries = e.value.split('|').map(x => x.trim()).filter(Boolean); else im.want = e.value; });
  return sc;
}

  const F = S.flows || [], R = (S.ideaRuns || []).slice().reverse();

const CONN = {};

async function loadConn(scope, back) {
  const el = $('#acc-' + scope); if (!el) return;

  const r = CONN[scope]; el.dataset.back = back; el.innerHTML = acctYT(r, scope, back) + acctMeta(r, scope, back);
  if (Object.values(r.tests || {}).some(t => t.running)) setTimeout(() => loadConn(scope, back), 4000);
}
const accChip = (s, label) => !s ? `<span class="chip">Not connected</span>` : s.connected ? `<span class="chip done"><i></i>${esc(label || 'Connected')}</span>` : `<span class="chip bad"><i></i>Login broken</span>`;
function testLine(t) {

}
function acctYT(r, scope, back) {

    <details><summary class="note">Or paste the client ID and secret</summary><div class="stack" style="gap:8px;margin-top:8px"><input id="gId-${scope}" placeholder="Client ID (ends in .apps.googleusercontent.com)" autocomplete="off"><input id="gSec-${scope}" placeholder="Client secret" type="password" autocomplete="off"><button class="btn" onclick="gClientSave('${scope}','${back}')">Save key</button></div></details>`;

    <div class="arow"><button class="btn ${y && y.connected ? '' : 'cta'}" onclick="location.href='/connect/google/start?scope=${scope}&back=${back}'">${y ? 'Reconnect YouTube' : 'Connect YouTube'}</button>
    ${y && y.connected ? `<button class="btn" onclick="accTest('${scope}','${back}','youtube')">Test upload (private)</button><button class="btn ghost" onclick="accDisc('${scope}','${back}','youtube','Disconnect YouTube?')">Disconnect</button>` : ''}</div>

function acctMeta(r, scope, back) {

  return h + testLine(T.instagram) + testLine(T.facebook) + `</div>`;
}
async function accPost(scope, back, a, b, ok) { try { const r = await api('/api/connect/' + a, { scope, ...b }); if (ok) toast(typeof ok === 'function' ? ok(r) : ok); } catch (e) { alert(e.message); } loadConn(scope, back); }

function gClientSave(scope, back) { accPost(scope, back, 'google-client', { clientId: $('#gId-' + scope).value, clientSecret: $('#gSec-' + scope).value }, 'Google key saved. Now press Connect YouTube.'); }

  const chans = ALLCAL.channels, colOf = id => id ? CHCOL[Math.max(0, chans.findIndex(c => c.id === id)) % CHCOL.length] : '#8a8f98';
  const days = new Map(ALLCAL.days.map(d => [d.date, d]));
  // grid: Monday of the first week shown through Sunday of the last
  const first = new Date((ALLCAL.days[0] || { date: S.today }).date + 'T12:00:00'); first.setDate(first.getDate() - ((first.getDay() + 6) % 7));

  const wk0 = new Date(S.today + 'T12:00:00'); wk0.setDate(wk0.getDate() - ((wk0.getDay() + 6) % 7)); const wkS = wk0.toISOString().slice(0, 10), wkE = new Date(wk0.getTime() + 6 * 864e5).toISOString().slice(0, 10);
  const inWeek = all.filter(x => x.date >= wkS && x.date <= wkE);

  const summary = `<div class="cstats">${stat('published this week', inWeek.filter(x => x.status === 'published').length, 'ok')}${stat('waiting for you', all.filter(x => ['script_review', 'video_review', 'upload_failed'].includes(x.status)).length, 'need')}${stat('being written or made', all.filter(x => ['writing', 'queued_render', 'rendering', 'approved', 'uploading'].includes(x.status)).length, 'work')}${stat('planned ahead', all.filter(x => x.planned).length, '')}</div>`;
  const chips = `<div class="cfilter" role="tablist" aria-label="Channel">${[['all', 'All channels'], ...chans.map(c => [c.id, c.name]), ...(ALLCAL.days.some(d => d.items.some(i => !i.flowId)) ? [['hand', 'Made by hand']] : [])].map(([id, n]) => `<button role="tab" aria-selected="${calChan === id}" class="${calChan === id ? 'on' : ''}" onclick="setCalChan('${id}')">${id !== 'all' ? `<i style="background:${id === 'hand' ? '#8a8f98' : colOf(id)}"></i>` : ''}${esc(n)}</button>`).join('')}</div>`;
  const MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const entry = it => { const x = calTopic(it.topic || it.title), title = it.id && it.title ? it.title : x.title, s2 = it.id ? st(it) : null;
    const click = it.id ? `onclick="openJ('${it.id}')" role="button" tabindex="0"` : it.mid ? `onclick="openMonthItem('${it.flowId}','${it.date}','${it.mid}')" role="button" tabindex="0"` : '';
    return `<li class="ce ${it.format}${it.planned ? ' plan' : ''}${it.id || it.mid ? ' go' : ''}" style="--cc:${colOf(it.flowId)}" ${click} title="${esc(it.channel + ' · ' + title + (it.mid ? ' (click to change the title or theme)' : ''))}">
      <span class="cm"><em>${it.format === 'long' ? 'Long' : 'Short'}</em>${it.publishAt ? esc(it.publishAt) : ''}${x.type ? ' · ' + esc(CALTYPE[x.type] || x.type) : it.kind ? ' · ' + esc(it.kind) : ''}</span>
      <b>${esc(title)}</b>${it.mid ? `<span class="cm">Theme: ${it.themes && it.themes.length ? esc(it.themes.join(', ')) : 'Auto'}</span>` : ''}
      ${s2 ? `<span class="cs ${s2[1]}"><i></i>${esc(s2[0])}</span>` : `<span class="cs"><i></i>Planned</span>`}
      ${it.urls && Object.keys(it.urls).length ? `<span class="cu">${Object.entries(it.urls).map(([k, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${{ youtube: 'YouTube', instagram: 'Instagram', facebook: 'Facebook' }[k] || k}</a>`).join('')}</span>` : ''}</li>`; };
  let cells = '';
  for (let d = new Date(first); d <= lastD; d.setDate(d.getDate() + 1)) {
    const ds = d.toISOString().slice(0, 10), day = days.get(ds), its = day ? day.items.filter(pick).sort((a, b) => (a.format === 'long' ? 0 : 1) - (b.format === 'long' ? 0 : 1) || String(a.publishAt || '').localeCompare(String(b.publishAt || ''))) : [];

  }

  const how = c.apiKey ? 'an Anthropic API key (billed per use)' : c.loggedIn ? 'your Claude account' + (c.plan ? ' (' + esc(c.plan) + ' plan)' : '') : '';
  el.innerHTML = `<h2 class="h2">Claude</h2>
    <p class="note" style="margin:0">Claude researches ideas, writes every plan and directs every scene. Connect it once, with your Claude account (Pro, Max or Team plan) or with an API key.</p>
    ${!c.installed ? `<p class="err" style="margin:0">Claude Code is not installed on this computer. Run install.ps1 again, or install it from claude.com/claude-code, then come back here.</p>`
      : `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="chip ${c.ready ? 'done' : 'bad'}"><i></i>${c.ready ? 'Connected' : 'Not connected'}</span><span>${c.ready ? 'Using ' + how + '.' : 'Videos cannot be planned until Claude is connected.'}</span>${c.version ? `<span class="note">Claude Code ${esc(c.version)}</span>` : ''}</div>`}
    ${msg ? `<p class="note" style="margin:0">${msg}</p>` : ''}
    ${c.installed ? `<div class="acts">
      ${c.loggedIn ? `<button class="btn" onclick="claudeAct('logout')">Sign out of the Claude account</button>` : `<button class="btn ${c.ready ? '' : 'cta'}" onclick="claudeAct('login')">Sign in with my Claude account</button>`}
      <button class="btn ghost" onclick="claudeAct('test',this)">Test the connection</button></div>
    <p class="note" style="margin:0">Sign-in opens a window and your browser on the computer that runs AutoTube Studio. Using the studio from another device? Use an API key instead.</p>
    <details${c.apiKey ? ' open' : ''}><summary>Use an Anthropic API key instead${c.apiKey ? ' (in use)' : ''}</summary><div class="stack" style="margin-top:12px">
      <p class="note" style="margin:0">From console.anthropic.com > API keys. It is saved only on this computer (config\.env), billed per use, and used instead of the account while it is set.</p>
      <div class="acts"><input id="claudeKey" type="password" autocomplete="off" placeholder="${c.apiKey ? 'A key is saved. Paste a new one to replace it.' : 'sk-ant-...'}" style="flex:1;min-width:240px"><button class="btn" onclick="claudeAct('key')">Save key</button>${c.apiKey ? `<button class="btn danger" onclick="claudeAct('nokey')">Remove key</button>` : ''}</div></div></details>` : ''}`;
}
async function claudeAct(a, btn) {
  try {
    if (a === 'login') {
      await api('/api/claude/login', {});
      loadClaude(false, 'A "Sign in to Claude" window opened, with your browser. Sign in there; this page updates by itself.');
      clearInterval(claudeWait); let n = 0;
      claudeWait = setInterval(async () => { const c = await api('/api/claude/status', { fresh: true }).catch(() => null); if ((c && c.loggedIn) || ++n > 60 || !$('#claudePanel')) { clearInterval(claudeWait); if (c && c.loggedIn) { loadClaude(false, 'Signed in.'); refresh(); } } }, 5000);
    }
    if (a === 'logout') { if (!confirm('Sign this computer out of the Claude account? Videos cannot be planned until you sign in again or add an API key.')) return; await api('/api/claude/logout', {}); loadClaude(true, 'Signed out.'); }
    if (a === 'key') { const k = $('#claudeKey').value.trim(); if (!k) return alert('Paste the API key first.'); await api('/api/claude/key', { key: k }); $('#claudeKey').value = ''; loadClaude(true, 'API key saved. Press "Test the connection" to check it.'); }
    if (a === 'nokey') { if (!confirm('Remove the API key? Claude then uses the signed-in account.')) return; await api('/api/claude/key', { key: '' }); loadClaude(true, 'API key removed.'); }
    if (a === 'test') { btn.disabled = true; btn.textContent = 'Testing...'; const r = await api('/api/claude/test', {}); loadClaude(true, r.ok ? `Working: Claude answered in ${r.seconds} s.` : 'Not working: ' + esc(r.error || 'no answer')); }
  } catch (e) { alert(e.message); if (btn) { btn.disabled = false; btn.textContent = 'Test the connection'; } }
}
function viewSettings() {
  const s = S.settings;
  setTimeout(() => loadClaude(), 0);
  return pagehead('Settings', 'Studio-wide defaults. Each channel has its own schedule, look and accounts.') + `<div class="panel stack" id="claudePanel" style="--i:0;margin-bottom:18px"><h2 class="h2">Claude</h2><p class="note" style="margin:0"><span class="spin"></span> Checking the Claude connection...</p></div><div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start">
   <div class="panel stack" style="--i:1"><h2 class="h2">Production</h2>
     <label class="f">Default narrator<select data-k="voice">${voiceOpts(s.voice)}</select></label>
     <label class="f">Speaking speed <small>1 is normal. Slightly under 1 sounds calmer.</small><input data-k="voiceSpeed" type="number" step="0.01" min="0.8" max="1.2" value="${s.voiceSpeed}" style="max-width:140px"></label>
     <label class="check"><input type="checkbox" class="sw" data-k="burnCaptions" ${s.burnCaptions ? 'checked' : ''}> Word-by-word captions in the video</label>
     <label class="check"><input type="checkbox" class="sw" data-k="claudePicksImages" ${s.claudePicksImages ? 'checked' : ''}> Claude picks the best photo (slower, better)</label>
     <label class="f">Render workers <small>Browser windows drawing frames at once. 3 suits this PC.</small><input data-k="renderWorkers" type="number" min="1" max="8" value="${s.renderWorkers}" style="max-width:140px"></label>
   </div>
   <div class="panel stack" style="--i:2"><h2 class="h2">Claude</h2>
     <label class="f">Model <small>Empty uses Claude Code's default.</small><input data-k="claudeModel" value="${esc(s.claudeModel)}"></label>
     <p class="note" style="margin:0">Claude runs through the Claude Code login on this PC. No API key is stored here.</p>
     <label class="f">Style library folder<input data-k="libraryPath" value="${esc(s.libraryPath)}"></label>
   </div></div>
   <div class="panel stack" style="--i:3;margin-top:20px"><h2 class="h2">Accounts</h2><p class="note" style="margin:0">Connect once here and every channel uploads with these accounts. A channel can use its own accounts instead (Channels, Edit, Uploads). Logins stay on this PC.</p>${connPanel('studio', 'settings')}</div>
   <div class="panel stack" style="--i:4;margin-top:20px"><h2 class="h2">YouTube channels</h2><p class="note" style="margin:0">Each AutoTube Studio channel can post to its own YouTube channel. Connect each with the Google account (or Brand Account) that owns it. A channel without its own login uses the studio account above.</p><div id="ytChans">${chanList()}</div>
     <div class="acts"><button class="btn cta" onclick="addYtChannel()">Add another YouTube channel</button></div></div>
   <div class="panel stack" style="--i:5;margin-top:20px"><h2 class="h2">Workers</h2><p class="note" style="margin:0">Workers make the videos. Each one takes the next video from the queue (Shorts first), so several videos are made at the same time. Add more PCs to make more at once.</p>${workersPanel()}</div>
   <div class="panel stack" style="--i:6;margin-top:20px"><h2 class="h2">Your voice</h2><p class="note" style="margin:0">Narrate videos in your own voice with ElevenLabs. Your recording becomes a voice clone, and every video can be read in it, with exact word timing for the captions.</p><div id="voicePanel"><p class="note">Loading</p></div></div>
   <div class="actionbar" style="justify-content:flex-end"><button class="btn cta big" onclick="saveSettings()">Save settings</button></div>`;
}
async function saveSettings() { const p = {}; $$('[data-k]').forEach(e => { p[e.dataset.k] = e.type === 'checkbox' ? e.checked : e.type === 'number' ? +e.value : e.value; }); try { await api('/api/settings', p); toast('Settings saved'); await refresh(true); } catch (e) { alert(e.message); } }

// ================= command palette =================
let palItems = [], palSel = 0;
function palette() {
  if (!S) return;
  palItems = [...TABS.map(([k, l]) => ({ l: 'Go to ' + l, h: 'page', run: () => go(k) })), { l: 'Make a video', h: 'action', run: () => go('ideas') }, { l: 'Add a channel', h: 'action', run: () => { tab = 'channels'; openId = null; flowEdit = 'new'; render(true); } }, { l: 'Switch light or dark', h: 'action', run: toggleTheme },
    ...(S.flows || []).map(f => ({ l: 'Edit channel ' + f.name, h: 'channel', run: () => { tab = 'channels'; openId = null; flowEdit = f.id; render(true); } })),
    ...S.jobs.slice().reverse().map(j => ({ l: j.title || j.topic, h: (j.format === 'long' ? 'long' : 'short') + (j.slot ? ' ' + j.slot : '') + ', ' + st(j)[0].toLowerCase(), run: () => openJ(j.id) }))];
  palSel = 0;
  $('#overlay').innerHTML = `<div class="modal" onclick="if(event.target===this)closeOv()"><div class="box pal" role="dialog" aria-label="Jump to anything"><input id="palq" placeholder="Type a page, channel or video" autocomplete="off" oninput="palSel=0;palList()" onkeydown="palKey(event)"><ul id="pall" role="listbox"></ul></div></div>`;
  palList(); $('#palq').focus();
}
function palMatches() { const q = ($('#palq')?.value || '').toLowerCase(); return palItems.filter(x => !q || x.l.toLowerCase().includes(q)).slice(0, 40); }
function palList() { const m = palMatches(); $('#pall').innerHTML = m.map((x, i) => `<li class="${i === palSel ? 'on' : ''}" role="option" aria-selected="${i === palSel}" onmousemove="if(palSel!==${i}){palSel=${i};palList()}" onclick="palRun(${i})">${esc(x.l)}<small>${esc(x.h)}</small></li>`).join('') || '<li style="cursor:default;color:var(--mute)">Nothing found</li>'; }
function palKey(e) { const n = palMatches().length || 1; if (e.key === 'ArrowDown') { palSel = (palSel + 1) % n; palList(); e.preventDefault(); } else if (e.key === 'ArrowUp') { palSel = (palSel - 1 + n) % n; palList(); e.preventDefault(); } else if (e.key === 'Enter') palRun(palSel); else if (e.key === 'Escape') closeOv(); }
function palRun(i) { const x = palMatches()[i]; closeOv(); if (x) x.run(); }
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#palq') ? closeOv() : palette(); } else if (e.key === 'Escape' && $('#overlay').innerHTML) closeOv(); });

// ================= render loop =================
function render() {
  chrome(); if (!S) return;
  const V = { ideas: viewIdeas, desk: viewDesk, review: viewReview, make: viewMake, log: viewLog, channels: viewChannels, calendar: viewCalendarAll, looks: viewLooks, settings: viewSettings };
  const key = openId ? 'job:' + openId : tab + ':' + (flowEdit || '');
  const m = $('#main'); m.innerHTML = openId ? viewJob() : V[tab]();
  m.classList.toggle('enter', key !== lastView); lastView = key;
  const nw = $('.rs-now'); if (nw) placeNow(nw);
}
// polls every 4 s, but only redraws when something changed and you're not typing, editing or watching
async function refresh(force) {
  try { S = await api('/api/state'); } catch { return; }
  const sig = JSON.stringify([S.jobs.map(j => [j.id, j.status, j.updatedAt]), (S.flows || []).map(f => [f.id, f.enabled, f.next && f.next.start, f.topics.length, f.jobs]), S.queues, (S.activity || [])[0], S.settings, (S.ideaRuns || []).map(r => [r.id, r.status, r.ideas.map(i => i.status + (i.jobStatus || ''))])]);
  const changed = sig !== lastSig; lastSig = sig;
  if (force === true) return render();
  if (!changed) return chrome();
  const typing = document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
  const watching = $$('#main video[controls]').some(v => !v.paused) || $$('.playing').length > 0;
  if (openId) { const j = S.jobs.find(x => x.id === openId); if (j && openJob && j.updatedAt !== openJob.updatedAt && !typing && !watching && !['script_review', 'draft'].includes(openJob.status)) await reloadJob(); else chrome(); return; }
  if (typing || watching || (tab === 'channels' && flowEdit) || ['make', 'settings'].includes(tab) || $('#overlay').innerHTML) return chrome();
  render();
}
tickClock(); setInterval(tickClock, 15000);
refresh(true); setInterval(refresh, 4000);
</script></body></html>
