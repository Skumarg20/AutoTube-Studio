<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>History Studio</title>
<style>
:root{
  --bg:#f5f4f1;--surface:#ffffff;--surface2:#faf9f7;--line:#e7e4de;--line2:#d9d5cd;--ink:#1d1b19;--soft:#6e6962;--faint:#a19b93;
  --accent:#d24a1f;--accent-ink:#fff;--accent-soft:#fdeee7;--ok:#178a4c;--ok-soft:#e5f5ec;--warn:#b86e00;--warn-soft:#fff3dc;--err:#c9302c;--err-soft:#fdecea;--info:#2b62d9;--info-soft:#e8effd;--vio:#7a45d6;--vio-soft:#f1eafd;
  --r:14px;--r2:10px;--sh:0 1px 2px rgba(20,16,10,.05),0 2px 8px rgba(20,16,10,.04);--sh2:0 8px 28px rgba(20,16,10,.10);
  --side:248px;color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111113;--surface:#1a1a1d;--surface2:#151517;--line:#2a2a2f;--line2:#36363c;--ink:#ecebe8;--soft:#a3a09a;--faint:#6f6c68;
  --accent:#f26a3d;--accent-soft:#3a2219;--ok:#3cc47a;--ok-soft:#163323;--warn:#f0a63a;--warn-soft:#3a2a10;--err:#f26b62;--err-soft:#3d1a18;--info:#6d9bff;--info-soft:#172645;--vio:#a985ff;--vio-soft:#2a1f45;
  --sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111113;--surface:#1a1a1d;--surface2:#151517;--line:#2a2a2f;--line2:#36363c;--ink:#ecebe8;--soft:#a3a09a;--faint:#6f6c68;
  --accent:#f26a3d;--accent-soft:#3a2219;--ok:#3cc47a;--ok-soft:#163323;--warn:#f0a63a;--warn-soft:#3a2a10;--err:#f26b62;--err-soft:#3d1a18;--info:#6d9bff;--info-soft:#172645;--vio:#a985ff;--vio-soft:#2a1f45;
  --sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Inter,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#f0a63a);display:grid;place-items:center;color:#fff;font:800 15px/1 Georgia,serif;box-shadow:0 4px 14px rgba(210,74,31,.35)}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}.brand span{display:block;font-size:12px;color:var(--soft)}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:0;border-radius:9px;background:none;color:var(--soft);font:inherit;font-weight:500;cursor:pointer;text-align:left}
#nav button:hover{background:var(--surface2);color:var(--ink)}
#nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
#nav .cnt{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;text-align:center}
#nav .sep{height:1px;background:var(--line);margin:8px 6px}
.side .foot{margin-top:auto;display:grid;gap:8px;padding:10px 6px 0;border-top:1px solid var(--line)}
.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--soft)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}.dot.busy{background:var(--info);box-shadow:0 0 0 3px var(--info-soft);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.45}}
.themebtn{border:1px solid var(--line);background:var(--surface2);color:var(--soft);border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px}
main#main{padding:28px 34px 60px;max-width:1400px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 22px}
.ph h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:700}.ph p{margin:4px 0 0;color:var(--soft)}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}#nav{flex-direction:row;flex-wrap:wrap}#nav .sep,.side .foot{display:none}.brand{padding:0 8px 0 0}main#main{padding:18px 16px}}
/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card h3{margin:0 0 6px;font-size:16px;font-weight:650;letter-spacing:-.01em}
.muted{color:var(--soft);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}@media(max-width:1000px){.two{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);display:flex;gap:14px;align-items:center;cursor:default}
.stat .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}.stat .ic svg{width:21px;height:21px}
.stat b{display:block;font-size:24px;line-height:1.1;letter-spacing:-.02em}.stat span{font-size:12.5px;color:var(--soft)}
.t-warn{background:var(--warn-soft);color:var(--warn)}.t-info{background:var(--info-soft);color:var(--info)}.t-ok{background:var(--ok-soft);color:var(--ok)}.t-acc{background:var(--accent-soft);color:var(--accent)}.t-vio{background:var(--vio-soft);color:var(--vio)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}.sec h2{margin:0;font-size:16px;font-weight:650}
/* ---------- job cards ---------- */
.job{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.job:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.job .media{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--surface2),var(--line));display:grid;place-items:center;color:var(--faint);overflow:hidden}
.job .media img{width:100%;height:100%;object-fit:cover}
.job .media.short{background:#000}.job .media .bgblur{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(16px) brightness(.6);transform:scale(1.15)}.job .media .fg{position:relative;width:auto;height:100%;object-fit:contain;box-shadow:0 0 30px rgba(0,0,0,.5)}
.job .media .ovl{position:absolute;inset:auto 10px 10px 10px;display:flex;gap:6px;justify-content:space-between;align-items:flex-end}
.job .media .fmt{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;background:rgba(0,0,0,.62);color:#fff;backdrop-filter:blur(4px)}
.job .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.job h3{margin:2px 0 0;font-size:15.5px;line-height:1.35;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.job .meta{font-size:12.5px;color:var(--soft);display:flex;gap:6px;flex-wrap:wrap}
.job .last{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .acts{margin-top:auto;padding-top:8px;display:flex;gap:8px;align-items:center}
.steps{display:flex;gap:3px;margin:6px 0 2px}.steps i{flex:1;height:4px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--ok)}.steps i.cur{background:var(--info)}
/* ---------- chips & pills ---------- */
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--soft);border:1px solid var(--line)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.script_review,.st.video_review{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.st.published,.st.approved{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.st.failed,.st.upload_failed,.st.rejected{background:var(--err-soft);color:var(--err);border-color:transparent}
.st.rendering,.st.writing,.st.uploading,.st.queued_render{background:var(--info-soft);color:var(--info);border-color:transparent}
.job .media .st{background:rgba(255,255,255,.92);border:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);color:var(--soft);white-space:nowrap}
/* ---------- buttons & forms ---------- */
button.b,a.b,label.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:inherit;font-weight:600;font-size:13.5px;padding:8px 14px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;transition:background .12s,border-color .12s,box-shadow .12s}
button.b:hover,a.b:hover,label.b:hover{background:var(--surface2);border-color:var(--faint);text-decoration:none}
button.b:disabled{opacity:.5;cursor:not-allowed}
button.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 2px 10px rgba(210,74,31,.25)}button.p:hover{background:var(--accent);filter:brightness(1.06)}
button.g{background:var(--ok);border-color:var(--ok);color:#fff}button.g:hover{background:var(--ok);filter:brightness(1.06)}
button.r{color:var(--err);border-color:var(--line)}button.r:hover{background:var(--err-soft);border-color:var(--err)}
input,select,textarea{font:inherit;font-size:14px;padding:9px 11px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--surface);color:var(--ink);outline:none;transition:border-color .12s,box-shadow .12s;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);padding:0}
textarea{width:100%;min-height:64px;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--soft)}
label.f>input,label.f>select,label.f>textarea{font-weight:400;color:var(--ink)}
.warn{color:var(--warn);font-size:13px;margin:3px 0}.err{color:var(--err);font-size:13px;margin:3px 0}
/* ---------- tables (plan editor) ---------- */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.scene:hover td{background:var(--surface2)}
td[colspan] {padding-top:16px}
.scene td input,.scene td textarea{width:100%}
details summary{cursor:pointer;font-weight:600;color:var(--soft)}
/* ---------- misc ---------- */
.log{font:12px/1.6 ui-monospace,"Cascadia Code",Consolas,monospace;white-space:pre-wrap;max-height:300px;overflow:auto;background:var(--surface2);border:1px solid var(--line);padding:12px 14px;border-radius:var(--r2);color:var(--soft)}
video{width:100%;border-radius:12px;background:#000;max-height:72vh;box-shadow:var(--sh2)}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--line)}
.empty{text-align:center;padding:48px 20px;color:var(--soft)}.empty .big{font-size:38px;margin-bottom:6px}
code{font:12.5px ui-monospace,Consolas,monospace;background:var(--surface2);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
/* style gallery + modal */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.sc:hover{transform:translateY(-3px);box-shadow:var(--sh2)}.sc .im{position:relative;aspect-ratio:16/9;background:#111}
.sc .im img,.sc .im video{width:100%;height:100%;object-fit:cover;display:block}.sc .bd{padding:10px 12px}
.badge{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:3px 8px;border-radius:7px;background:rgba(0,0,0,.7);color:#fff}
.badge.fast{background:var(--ok)}.badge.ai{background:var(--vio)}
.modal{position:fixed;inset:0;background:rgba(10,8,6,.62);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--surface);border-radius:18px;max-width:1120px;width:100%;max-height:94vh;overflow:auto;padding:22px;box-shadow:var(--sh2)}
.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--sh2);font-weight:600;z-index:30;opacity:0;transform:translateY(8px);transition:.2s}
.toast.on{opacity:1;transform:none}
.feed{display:grid;gap:0;max-height:340px;overflow:auto}
.feed div{display:flex;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px}.feed div:last-child{border:0}
.feed time{color:var(--faint);font:12px ui-monospace,Consolas,monospace;min-width:84px}
</style></head><body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="logo">HS</div><div><b>History Studio</b><span id="chan"></span></div></div>
  <nav id="nav"></nav>
  <div class="foot"><div id="conn"></div><div id="q" class="conn"></div><button class="themebtn" onclick="toggleTheme()">◐ Light / dark</button></div>
</aside>
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const api = async (p, b) => { const r = await fetch(p, b === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(b) }); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; };
let STY = [], pickFor = null, modalSlug = null, sFilter = { q: '', cat: '', mode: '' };
let S = null, tab = 'today', openId = null, openJob = null, dirty = false;
const TABS = [['today', 'Today'], ['review', 'Needs review'], ['create', 'Create'], ['styles', 'Styles 🎨'], ['themes', 'Themes'], ['library', 'All videos'], ['settings', 'Settings']];
const STEPS = ['writing', 'script_review', 'queued_render', 'rendering', 'video_review', 'approved', 'uploading', 'published'];
const LABEL = { draft: 'Add your content', writing: 'Writing script', script_review: 'Check script', queued_render: 'Waiting to render', rendering: 'Rendering', video_review: 'Check video', approved: 'Approved – scheduled', uploading: 'Uploading', published: 'Published', failed: 'Failed', upload_failed: 'Upload failed', rejected: 'Rejected' };

// ---------- UI shell (redesign) ----------
const ICON = {
  today: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>',
  review: '<svg class="i" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h9"/></svg>',
  create: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  styles: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.2-1.8-.5-1 .1-2.2 1.3-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>',
  themes: '<svg class="i" viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>',
  library: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>',
  settings: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  pen: '<svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  film: '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></svg>',
  spin: '<svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>',
  up: '<svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
};
const PAGES = {
  today: ['Today', () => `Plan for ${S.today} · ${esc(S.settings.activeTheme)} · 2 long videos + 4 Shorts`],
  review: ['Needs review', () => 'Scripts and videos waiting for your approval'],
  create: ['Create a video', () => 'Make one extra video on any topic'],
  styles: ['Style gallery', () => 'All library styles with sample videos, for inspiration'],
  themes: ['Themes & packs', () => 'Your series, their style packs and topic queues'],
  library: ['All videos', () => `${S.jobs.length} videos made so far`],
  settings: ['Settings', () => 'Channel, voice, automation and publishing'],
};
const needCount = () => S ? S.jobs.filter(j => j.status === 'script_review' || j.status === 'video_review').length : 0;
function nav() {
  const items = [['today', 'Today'], ['review', 'Needs review'], ['create', 'Create'], ['library', 'All videos'], 'sep', ['flows', 'Autoflows'], ['themes', 'Themes & packs'], ['styles', 'Style gallery'], ['settings', 'Settings']];
  $('#nav').innerHTML = items.map(it => it === 'sep' ? '<div class="sep"></div>' : `<button class="${tab === it[0] && !openId ? 'on' : ''}" onclick="go('${it[0]}')">${ICON[it[0]]}<span>${it[1]}</span>${it[0] === 'review' && needCount() ? `<span class="cnt">${needCount()}</span>` : ''}</button>`).join('');
  if (S) $('#chan').textContent = S.settings.channelName || '';
}
function go(t) { tab = t; openId = null; render(); window.scrollTo(0, 0); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove('on'), 2600); }
function toggleTheme() { const r = document.documentElement, cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), nx = cur === 'dark' ? 'light' : 'dark'; r.dataset.theme = nx; try { localStorage.setItem('hs-theme', nx); } catch {} }
try { const th = localStorage.getItem('hs-theme'); if (th) document.documentElement.dataset.theme = th; } catch {}
function steps(j) { const k = STEPS.indexOf(j.status); return `<div class="steps" title="${esc(LABEL[j.status] || j.status)}">${STEPS.map((s, i) => `<i class="${i < k ? 'on' : i === k ? (['published'].includes(j.status) ? 'on' : 'cur') : ''}"></i>`).join('')}</div>`; }
function card(j) {

  const F = S.flows || [], fsel = `<label class="f">Channel / autoflow<select id="cFlow">${F.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label>`;
  const fmt = `<label class="f">Format<select id="cFmt"><option value="short">Short / Reel (about 45 s)</option><option value="long">Long video</option></select></label>`;
  const mode = (k, ic, t, d) => `<div class="card" onclick="createMode='${k}';render()" style="cursor:pointer;${createMode === k ? 'border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)' : ''}"><div style="font-size:26px">${ic}</div><h3 style="margin-top:6px">${t}</h3><div class="muted">${d}</div></div>`;
  const form = createMode === 'auto' ? `<label class="f">Topic (optional: leave empty and Claude picks the next researched topic)<input id="cTopic" placeholder="e.g. The fall of Vijayanagara"></label>`
    : createMode === 'brief' ? `<label class="f">Video title (used exactly as you write it)<input id="cTitle" maxlength="100" placeholder="e.g. The Day Salt Beat the British Empire"></label><label class="f">Your prompt / brief<textarea id="cPrompt" rows="5" placeholder="What should the video cover? Angle, key facts, people, tone, what to avoid…"></textarea></label>`
    : `<label class="f">Video title or topic<input id="cTitle" placeholder="e.g. My trip to Hampi: the city that time forgot"></label><label class="f">What should the video say? (optional brief)<textarea id="cPrompt" rows="4" placeholder="Describe the story; Claude will build it around your photos, clips and voice"></textarea></label>
       <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cVF"> I will upload my own narration, and the video should follow my recording</label><div class="muted">Next you'll upload your photos, video clips and/or voice, then start the plan.</div>`;
  return `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:16px">
    ${mode('auto', '🤖', 'Full auto', 'Claude researches the topic, writes the title, script and shot plan, and finds the photos.')}
    ${mode('brief', '✍️', 'Title + prompt', 'You give the title and a brief; Claude researches and builds the video from it.')}
    ${mode('own', '🎬', 'My own content', 'Upload your own voice, photos and video clips; Claude plans the video around them.')}</div>
  <div class="card" style="max-width:760px"><div style="display:grid;gap:12px">${F.length ? fsel : ''}${fmt}${form}<div class="row" style="margin:0"><button class="b p" onclick="createOne()">${createMode === 'own' ? 'Create draft & add my content' : 'Write the plan'}</button></div></div></div>`;
}
async function createOne() {
  const b = { mode: createMode, flowId: $('#cFlow') ? $('#cFlow').value : null, format: $('#cFmt').value };
  if (createMode === 'auto') b.topic = ($('#cTopic').value || '').trim();
  else { b.title = $('#cTitle').value.trim(); b.prompt = $('#cPrompt').value.trim(); b.topic = b.title; if (!b.title) return alert('Give the video a title'); if (createMode === 'own') b.voiceFirst = $('#cVF').checked; }
  try { const j = await api('/api/jobs', b); toast(createMode === 'own' ? 'Draft created: add your content' : 'Claude is writing the plan'); if (createMode === 'own') await openJ(j.id); else go('library'); } catch (e) { alert(e.message); }
}
// ---------- own content panel (draft videos) ----------
function viewOwnContent(j) {
  const M = j.media || [];
  return `<div class="card" style="margin-top:14px"><h3>Your content</h3><div class="muted">Add photos and video clips (with a short description of what each shows) and, if you like, your own narration. Then start the plan: Claude builds the video around them.</div>
   <div class="row"><label class="b" style="cursor:pointer">⬆ Add photos / video clips<input type="file" multiple accept="image/*,video/*" style="display:none" onchange="mediaUpload(this)"></label><label class="b" style="cursor:pointer">🎙 ${j.voiceFile ? 'Replace' : 'Add'} my narration<input type="file" accept="audio/*,video/*" style="display:none" onchange="voiceUpload(this)"></label><span class="muted" id="vup"></span></div>
   ${M.length ? `<table style="margin-top:12px"><tr><th>Item</th><th>What it shows</th><th></th></tr>${M.map(m => `<tr><td style="width:180px">${m.kind === 'image' ? '🖼️' : '🎞️'} <b>${esc(m.id)}</b><div class="muted">${esc(m.name)}${m.dur ? ' · ' + m.dur.toFixed(1) + ' s' : ''}</div></td><td class="muted">${esc(m.desc)}</td><td style="width:40px"><button class="b r" onclick="mediaRemove('${m.id}')">✕</button></td></tr>`).join('')}</table>` : ''}
   ${j.voiceFile ? `<div class="row"><span class="pill">🎙 narration: ${esc(j.voiceFile)}</span><span class="muted">${j.voiceFirst ? 'the plan will follow your recording' : 'it will be matched to the script'}</span></div>` : ''}
   <div class="row"><button class="b p" onclick="jact('start')">✨ Write the plan from my content</button></div></div>`;
}
async function mediaUpload(inp) {
  for (const file of inp.files) { const desc = prompt(`What does "${file.name}" show? (one line, helps Claude use it in the right place)`, '') || file.name; $('#vup').textContent = 'uploading ' + file.name + '…'; const r = await fetch('/api/jobs/' + openJob.id + '/media', { method: 'POST', headers: { 'x-filename': file.name, 'x-desc': encodeURIComponent(desc) }, body: file }); if (!r.ok) { alert((await r.json()).error); break; } }
  await openJ(openJob.id);
}
async function mediaRemove(id) { await api('/api/jobs/' + openJob.id + '/media-remove', { id }); await openJ(openJob.id); }

function render() {
  nav(); if (!S) return;
  const q = S.queues, busy = q.writing + q.rendering; $('#q').innerHTML = `<span class="dot ${busy ? 'busy' : ''}"></span>${busy ? `Working · ${q.writing} writing · ${q.rendering} rendering` : 'Idle'}`;
  $('#conn').innerHTML = ['youtube', 'instagram'].map(k => `<div class="conn"><span class="dot ${S.connections?.[k]?.connected ? 'on' : ''}"></span>${k === 'youtube' ? 'YouTube' : 'Instagram'}${S.connections?.[k]?.connected ? '' : ' · not connected'}</div>`).join('');
  $('#main').innerHTML = pageHead() + (openId ? viewJob() : ({ today: viewToday, review: viewReview, create: viewCreate, styles: viewStyles, flows: viewFlows, themes: viewThemes, library: viewLibrary, settings: viewSettings })[tab]()) + (modalSlug ? viewModal() : '');
}
async function refresh() {
  S = await api('/api/state');
  if (modalSlug || (tab === 'styles' && !openId)) return nav();
  if (openId) { const j = S.jobs.find(x => x.id === openId); if (j && j.updatedAt !== openJob.updatedAt && !document.activeElement?.closest?.('.card')) { openJob = await api('/api/jobs/' + openId); render(); } else nav(); return; }
  if ((['themes', 'settings', 'create'].includes(tab) && document.activeElement && document.activeElement.tagName !== 'BODY') || (tab === 'flows' && flowEdit) || (tab === 'create')) return nav();
  render();
}
api('/api/styles').then(x => { STY = x; render(); }); refresh(); setInterval(refresh, 4000);
</script></body></html>
